<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MGC Admin</title>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app"></div>

    <!-- SteamGridDB Picker Modal -->
    <div id="sgdb-modal" class="sgdb-modal" hidden>
        <div class="sgdb-modal-content">
            <div class="sgdb-modal-header">
                <h3>Choose a cover from SteamGridDB</h3>
                <button id="sgdb-modal-close" class="btn btn-danger" type="button">✕</button>
            </div>
            <div class="sgdb-modal-body">
                <input type="text" id="sgdb-search-input" placeholder="Search for a game…" autocomplete="off" />
                <div id="sgdb-results" class="sgdb-results-grid"></div>
                <div id="sgdb-grids" class="sgdb-grids-grid"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
